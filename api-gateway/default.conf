events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # ----------------------------------------------------
        # SUPPRESSION DES DOUBLONS CORS (Le fix pour l'erreur 403)
        # Nginx retire les headers envoyés par Java pour ne garder que les siens
        # ----------------------------------------------------
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Methods';

        # ----------------------------------------------------
        # PRIORITÉ : Gestion des rôles (Auth Service)
        # ----------------------------------------------------
        location /api/admin/users {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://auth-service:8080;
        }

        # ----------------------------------------------------
        # SERVICE AUTHENTIFICATION
        # ----------------------------------------------------
        location /api/auth {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://auth-service:8080;
        }

        # ----------------------------------------------------
        # SERVICE USER (Marius & Hector)
        # ----------------------------------------------------
        location /api/admin {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://user-service:8080;
        }

        location /api/users {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://user-service:8080;
        }

        # ----------------------------------------------------
        # SERVICE COMPÉTITION
        # ----------------------------------------------------
        location /api/epreuves {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://competition-service:8080;
        }

        # ----------------------------------------------------
        # SERVICE NOTIFICATION
        # ----------------------------------------------------
        location /api/notification/ {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://notification-service:8080/;
        }

        # ----------------------------------------------------
        # EXPORTER & HEALTH
        # ----------------------------------------------------
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location /health {
            return 200 'Gateway OK';
        }
    }
}