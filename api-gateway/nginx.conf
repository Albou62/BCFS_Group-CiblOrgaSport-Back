events {
    worker_connections 1024;
}

http {
    # --- CONFIGURATION DES TIMEOUTS 
    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;

    # Ajout des buffers pour éviter les coupures sur les gros transferts de données
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 80;

        # 1. Gestion des Headers CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # ----------------------------------------------------
        # REDIRECTIONS DES SERVICES
        # ----------------------------------------------------

        # AUTH SERVICE
        location /api/auth {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-auth:8080; 
        }

        location /api/admin/users {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-auth:8080;
        }

        # USER SERVICE
        location /api/users {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-user:8080;
        }

        location /api/admin {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-user:8080;
        }

        # COMPETITION SERVICE
        location /api/epreuves {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-competition:8080;
        }

        location /api/competitions {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-competition:8080;
        }

        location /api/public/ {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-competition:8080;
        }

        # --- AJOUT : GESTION DES MANCHES (Arbitrage & Podium) ---
        location /api/manches {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-competition:8080;
        }

        # NOTIFICATION SERVICE
        location /api/notification/ {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://ciblorgasport-notification:8080/;
        }

        # ----------------------------------------------------
        # MONITORING & HEALTH
        # ----------------------------------------------------
        location /health {
            return 200 'Gateway OK';
        }

        location /nginx_status {
            stub_status;
            allow all;
        }
    }
}