events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Nginx DÉTRUIT les headers envoyés par Spring Boot (Sans guillemets !)
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        # 2. Nginx AJOUTE les siens (une seule fois pour tout le monde)
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        # ----------------------------------------------------
        # REDIRECTIONS DES SERVICES
        # ----------------------------------------------------
        location /api/admin/users {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://auth-service:8080;
        }

        location /api/auth {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://auth-service:8080;
        }

        location /api/admin {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://user-service:8080;
        }

        location /api/users {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://user-service:8080;
        }

        location /api/epreuves {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://competition-service:8080;
        }
        
        location /api/competitions {
    if ($request_method = 'OPTIONS') { return 204; }
    proxy_pass http://competition-service:8080; # Ou le nom de ton service gérant les compétitions
}

        location /api/notification/ {
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://notification-service:8080/;
        }

       location /api/public/ {
    if ($request_method = 'OPTIONS') { return 204; }
    proxy_pass http://competition-service:8080; 
}

        # ----------------------------------------------------
        # MONITORING
        # ----------------------------------------------------
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location /health {
            return 200 'Gateway OK';
        }
    }
}